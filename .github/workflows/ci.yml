name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features

      # The engine must build and test with no interface present. That is the property the
      # two-repository split exists to protect, so it is worth asserting rather than assuming.
      - name: No interface toolchain required
        run: |
          if [ -f package.json ] || [ -d node_modules ]; then
            echo "::error::the engine must not depend on interface tooling"
            exit 1
          fi

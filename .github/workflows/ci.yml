name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. Nothing in CI writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features

      # The engine must build and test with no interface present. That is the property the
      # two-repository split exists to protect, so it is worth asserting rather than assuming.
      - name: No interface toolchain required
        run: |
          if [ -f package.json ] || [ -d node_modules ]; then
            echo "::error::the engine must not depend on interface tooling"
            exit 1
          fi

[workspace]
members = ["crates/lc-engine"]
resolver = "2"

[workspace.package]
version = "0.20.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Tuominen04/learning-corner-engine"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
ulid = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
rusqlite = { version = "0.40", features = ["bundled"] }
blake3 = "1"
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
roxmltree = "0.21"
pdf-writer = "0.15"
subsetter = { version = "0.2", default-features = false }
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
png = "0.18"
gif = { version = "0.14", default-features = false, features = ["std"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
lopdf = { version = "0.45", default-features = false }

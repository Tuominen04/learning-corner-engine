[workspace]
members = ["crates/plc-engine"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Tuominen04/personal-learning-corner-engine"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
ulid = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
rusqlite = { version = "0.40", features = ["bundled"] }
blake3 = "1"
tempfile = "3"

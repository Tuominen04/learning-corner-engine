# Chapters in edited books. Examples from the APA manual (7th ed., §10.3) and the rules in
# docs/technical/citation-model.md.

[[case]]
name = "three editors: commas, and an ampersand before the last"
parenthetical = "(Aron et al., 2019)"
narrative = "Aron et al. (2019)"
reference = "Aron, L., Botella, M., & Lubart, T. (2019). Culinary arts: Talent and their development. In R. F. Subotnik, P. Olszewski-Kubilius, & F. C. Worrell (Eds.), *The psychology of high performance: Developing human potential into domain-specific talent* (pp. 345–359). American Psychological Association. https://doi.org/10.1037/0000120-016"

[case.source]
id = "01JA00000000000000000000C1"
type = "book-chapter"
title = "Culinary arts: Talent and their development"
date = { year = 2019 }
container = "The psychology of high performance: Developing human potential into domain-specific talent"
publisher = "American Psychological Association"
pages = "345-359"
doi = "10.1037/0000120-016"
contributors = [
  { role = "author", family = "Aron", given = "Laurie" },
